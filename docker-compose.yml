version: '3.8'

services:
  frontend:
    build: .
    container_name: finbuddy-frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    restart: always

  backend:
    build: .
    container_name: finbuddy-backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always
